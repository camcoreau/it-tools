services:
  it-tools:
    container_name: camcore-it-tools
    image: camcore-it-tools:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "198086:80"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
